name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  web-and-tests:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run release:check

      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build frontend bundle
        run: npm run build

  tauri-native:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run native tests
        run: cargo test
        working-directory: src-tauri
