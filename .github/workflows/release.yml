name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos-beta:
    runs-on: macos-14
    outputs:
      dmg_asset_name: ${{ steps.assets.outputs.dmg_asset_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Run tests
        run: npm test

      - name: Run native tests
        run: cargo test
        working-directory: src-tauri

      - name: Build signed macOS release
        run: npm run tauri:build

      - name: Prepare updater metadata
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          DMG_PATH="$(find src-tauri/target/release/bundle -name '*.dmg' | head -n 1)"
          APP_TAR_PATH="$(find src-tauri/target/release/bundle -name '*.app.tar.gz' | head -n 1)"
          SIG_PATH="$(find src-tauri/target/release/bundle -name '*.app.tar.gz.sig' | head -n 1)"

          test -n "$DMG_PATH"
          test -n "$APP_TAR_PATH"
          test -n "$SIG_PATH"

          node scripts/generate-latest-json.mjs \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --platform-key "darwin-aarch64" \
            --artifact "$APP_TAR_PATH" \
            --signature-file "$SIG_PATH" \
            --output "release/latest.json"

          echo "dmg_path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "app_tar_path=$APP_TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "sig_path=$SIG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg_asset_name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            ${{ steps.assets.outputs.dmg_path }}
            ${{ steps.assets.outputs.app_tar_path }}
            ${{ steps.assets.outputs.sig_path }}
            release/latest.json

  release-windows-msi:
    runs-on: windows-latest
    outputs:
      msi_asset_name: ${{ steps.windows_assets.outputs.msi_asset_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Run tests
        run: npm test

      - name: Run native tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Windows MSI release
        run: npm run tauri:build:windows-msi

      - name: Locate MSI asset
        id: windows_assets
        shell: bash
        run: |
          set -euo pipefail
          MSI_PATH="$(find src-tauri/target/release/bundle -name '*.msi' | head -n 1)"
          test -n "$MSI_PATH"
          echo "msi_path=$MSI_PATH" >> "$GITHUB_OUTPUT"
          echo "msi_asset_name=$(basename "$MSI_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish Windows MSI asset
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: ${{ steps.windows_assets.outputs.msi_path }}


  update-site-downloads:
    runs-on: ubuntu-latest
    needs:
      - release-macos-beta
      - release-windows-msi
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate latest site download metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-site-downloads.mjs \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --mac-asset-name "${{ needs.release-macos-beta.outputs.dmg_asset_name }}" \
            --windows-asset-name "${{ needs.release-windows-msi.outputs.msi_asset_name }}" \
            --output site/downloads.json

      - name: Commit updated site metadata
        run: |
          if git diff --quiet -- site/downloads.json; then
            echo "No site metadata changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/downloads.json
          git commit -m "Update site downloads for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
