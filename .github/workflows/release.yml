name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release-macos-beta:
    runs-on: macos-14
    outputs:
      apple_silicon_dmg_asset_name: ${{ steps.assets.outputs.apple_silicon_dmg_asset_name }}
      intel_dmg_asset_name: ${{ steps.assets.outputs.intel_dmg_asset_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Run tests
        run: npm test

      - name: Run native tests
        run: cargo test
        working-directory: src-tauri

      - name: Build ad-hoc signed macOS Apple Silicon release
        run: npm run tauri:build -- --target aarch64-apple-darwin

      - name: Build ad-hoc signed macOS Intel release
        run: npm run tauri:build -- --target x86_64-apple-darwin

      - name: Verify macOS app signature
        shell: bash
        run: |
          set -euo pipefail
          for APP_PATH in \
            "$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app' | head -n 1)" \
            "$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name '*.app' | head -n 1)"; do
            test -n "$APP_PATH"
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            codesign --display --verbose=2 "$APP_PATH"
          done

      - name: Prepare updater metadata
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release

          ARM_DMG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.dmg' | head -n 1)"
          ARM_APP_TAR_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz' | head -n 1)"
          ARM_SIG_PATH="$(find src-tauri/target/aarch64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' | head -n 1)"
          INTEL_DMG_PATH="$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name '*.dmg' | head -n 1)"
          INTEL_APP_TAR_PATH="$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name '*.app.tar.gz' | head -n 1)"
          INTEL_SIG_PATH="$(find src-tauri/target/x86_64-apple-darwin/release/bundle -name '*.app.tar.gz.sig' | head -n 1)"

          test -n "$ARM_DMG_PATH"
          test -n "$ARM_APP_TAR_PATH"
          test -n "$ARM_SIG_PATH"
          test -n "$INTEL_DMG_PATH"
          test -n "$INTEL_APP_TAR_PATH"
          test -n "$INTEL_SIG_PATH"

          node scripts/generate-latest-json.mjs \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --platform-key "darwin-aarch64" \
            --artifact "$ARM_APP_TAR_PATH" \
            --signature-file "$ARM_SIG_PATH" \
            --platform-key "darwin-x86_64" \
            --artifact "$INTEL_APP_TAR_PATH" \
            --signature-file "$INTEL_SIG_PATH" \
            --output "release/latest.json"

          echo "apple_silicon_dmg_path=$ARM_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "apple_silicon_app_tar_path=$ARM_APP_TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "apple_silicon_sig_path=$ARM_SIG_PATH" >> "$GITHUB_OUTPUT"
          echo "apple_silicon_dmg_asset_name=$(basename "$ARM_DMG_PATH")" >> "$GITHUB_OUTPUT"
          echo "intel_dmg_path=$INTEL_DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "intel_app_tar_path=$INTEL_APP_TAR_PATH" >> "$GITHUB_OUTPUT"
          echo "intel_sig_path=$INTEL_SIG_PATH" >> "$GITHUB_OUTPUT"
          echo "intel_dmg_asset_name=$(basename "$INTEL_DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.assets.outputs.apple_silicon_dmg_path }}
            ${{ steps.assets.outputs.apple_silicon_app_tar_path }}
            ${{ steps.assets.outputs.apple_silicon_sig_path }}
            ${{ steps.assets.outputs.intel_dmg_path }}
            ${{ steps.assets.outputs.intel_app_tar_path }}
            ${{ steps.assets.outputs.intel_sig_path }}
            release/latest.json

  release-windows-msi:
    runs-on: windows-latest
    outputs:
      msi_asset_name: ${{ steps.windows_assets.outputs.msi_asset_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync
        run: npm run release:check -- "${GITHUB_REF_NAME}"

      - name: Run tests
        run: npm test

      - name: Run native tests
        run: cargo test
        working-directory: src-tauri

      - name: Build Windows MSI release
        run: npm run tauri:build:windows-msi

      - name: Locate MSI asset
        id: windows_assets
        shell: bash
        run: |
          set -euo pipefail
          MSI_PATH="$(find src-tauri/target/release/bundle -name '*.msi' | head -n 1)"
          test -n "$MSI_PATH"
          echo "msi_path=$MSI_PATH" >> "$GITHUB_OUTPUT"
          echo "msi_asset_name=$(basename "$MSI_PATH")" >> "$GITHUB_OUTPUT"

      - name: Publish Windows MSI asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.windows_assets.outputs.msi_path }}


  update-site-downloads:
    runs-on: ubuntu-latest
    needs:
      - release-macos-beta
      - release-windows-msi
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate latest site download metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/generate-site-downloads.mjs \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --mac-apple-silicon-asset-name "${{ needs.release-macos-beta.outputs.apple_silicon_dmg_asset_name }}" \
            --mac-intel-asset-name "${{ needs.release-macos-beta.outputs.intel_dmg_asset_name }}" \
            --windows-asset-name "${{ needs.release-windows-msi.outputs.msi_asset_name }}" \
            --output site/downloads.json

      - name: Commit updated site metadata
        run: |
          if git diff --quiet -- site/downloads.json; then
            echo "No site metadata changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/downloads.json
            git commit -m "Update site downloads for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy site
        uses: actions/deploy-pages@v4
